name: Build & Push match_composer Base Images

on:
  push:
    branches: [main, nightly]
    tags: ["v*"]
    paths:
      - "match_composer/base.Dockerfile"
      - "match_composer/bundled.Dockerfile"
      - "match_composer/hub/**"
      - ".github/workflows/docker-mc-hub.yml"
  pull_request:
    branches: [main, nightly]
    paths:
      - "match_composer/base.Dockerfile"
      - "match_composer/bundled.Dockerfile"
      - "match_composer/hub/**"
      - ".github/workflows/docker-mc-hub.yml"
  workflow_dispatch:

env:
  REGISTRY: registry.cn-beijing.aliyuncs.com
  IMAGE_NAME: nexus-prime/rcss-mc-base

jobs:
  build-base:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to Alibaba Cloud Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_REGISTRY_PASSWORD }}

      - name: Extract base image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=sha,prefix=nightly-,enable=${{ github.ref == 'refs/heads/nightly' }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./match_composer/base.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=match-composer-base
          cache-to: type=gha,mode=max,scope=match-composer-base

  build-bundled:
    runs-on: ubuntu-latest
    needs: build-base
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: read

    steps:
      - name: Resolve runtime base image
        id: base
        shell: bash
        run: |
          set -euo pipefail
          short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_tag="latest"
          else
            base_tag="sha-$short_sha"
          fi
          echo "image=${REGISTRY}/${IMAGE_NAME}:$base_tag" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to Alibaba Cloud Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_REGISTRY_PASSWORD }}

      - name: Extract bundled image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=bundled-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,prefix=bundled-
            type=semver,pattern=bundled-{{version}}
            type=semver,pattern=bundled-{{major}}.{{minor}}
            type=sha,prefix=bundled-sha-
            type=sha,prefix=bundled-nightly-,enable=${{ github.ref == 'refs/heads/nightly' }}

      - name: Build and push bundled base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./match_composer/bundled.Dockerfile
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=match-composer-bundled-base
          cache-to: type=gha,mode=max,scope=match-composer-bundled-base

  retag-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: read

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_REGISTRY_PASSWORD }}

      - name: Extract source base image tag
        id: base-source
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha

      - name: Extract release base image tags
        id: base-release
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Extract source bundled image tag
        id: bundled-source
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=bundled-sha-

      - name: Extract release bundled image tags
        id: bundled-release
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=bundled-{{version}}
            type=semver,pattern=bundled-{{major}}.{{minor}}

      - name: Wait for source images
        env:
          BASE_SOURCE_IMAGE: ${{ steps.base-source.outputs.tags }}
          BUNDLED_SOURCE_IMAGE: ${{ steps.bundled-source.outputs.tags }}
        run: |
          for image in "$BASE_SOURCE_IMAGE" "$BUNDLED_SOURCE_IMAGE"; do
            for _ in 1 2 3 4 5; do
              if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
                break
              fi
              sleep 30
            done
            if ! docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "Source image not found: $image" >&2
              exit 1
            fi
          done

      - name: Retag release images
        env:
          BASE_SOURCE_IMAGE: ${{ steps.base-source.outputs.tags }}
          BASE_RELEASE_TAGS: ${{ steps.base-release.outputs.tags }}
          BUNDLED_SOURCE_IMAGE: ${{ steps.bundled-source.outputs.tags }}
          BUNDLED_RELEASE_TAGS: ${{ steps.bundled-release.outputs.tags }}
        run: |
          retag() {
            local source_image="$1"
            local release_tags="$2"
            local tags=()
            while IFS= read -r tag; do
              [ -n "$tag" ] && tags+=(-t "$tag")
            done <<< "$release_tags"
            docker buildx imagetools create "${tags[@]}" "$source_image"
          }

          retag "$BASE_SOURCE_IMAGE" "$BASE_RELEASE_TAGS"
          retag "$BUNDLED_SOURCE_IMAGE" "$BUNDLED_RELEASE_TAGS"
