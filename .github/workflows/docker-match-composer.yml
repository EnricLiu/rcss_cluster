name: Build & Push match_composer Image

on:
  push:
    branches: [main, nightly]
    tags: ["v*"]
    paths:
      - "match_composer/src/**"
      - "match_composer/Cargo.toml"
      - "match_composer/Dockerfile"
      - "common/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docker-match-composer.yml"
  pull_request:
    branches: [main, nightly]
    paths:
      - "match_composer/src/**"
      - "match_composer/Cargo.toml"
      - "match_composer/Dockerfile"
      - "common/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docker-match-composer.yml"
  # Rebuild when runtime base images are updated
  workflow_run:
    workflows: ["Build & Push match_composer Base Images"]
    types: [completed]
    branches: [main, nightly]
  workflow_dispatch:

env:
  REGISTRY: registry.cn-beijing.aliyuncs.com
  IMAGE_NAME: nexus-prime/rcss-match-composer
  BASE_IMAGE_REPOSITORY: registry.cn-beijing.aliyuncs.com/nexus-prime/rcss-mc-base

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Skip failed base builds and PR base builds that did not push sha images.
    if: >-
      (github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')) &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request'))

    permissions:
      contents: read

    steps:
      - name: Resolve source context
        id: context
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${BASE_IMAGE_REPOSITORY}" ]; then
            echo "BASE_IMAGE_REPOSITORY is empty" >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            checkout_ref="${{ github.event.workflow_run.head_sha }}"
            source_sha="${{ github.event.workflow_run.head_sha }}"
            source_branch="${{ github.event.workflow_run.head_branch }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            checkout_ref="${{ github.event.pull_request.head.sha }}"
            source_sha="${{ github.event.pull_request.head.sha }}"
            source_branch="${{ github.event.pull_request.head.ref }}"
          else
            checkout_ref="${{ github.sha }}"
            source_sha="${{ github.sha }}"
            source_branch="${{ github.ref_name }}"
          fi

          short_sha="$(printf '%s' "$source_sha" | cut -c1-7)"

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            base_tag="sha-$short_sha"
            bundled_base_tag="bundled-sha-$short_sha"
          elif [ "$source_branch" = "main" ] || [ "$source_branch" = "nightly" ]; then
            base_tag="$source_branch"
            bundled_base_tag="bundled-$source_branch"
          else
            base_tag="latest"
            bundled_base_tag="bundled-latest"
          fi

          base_image="${BASE_IMAGE_REPOSITORY}:$base_tag"
          bundled_base_image="${BASE_IMAGE_REPOSITORY}:$bundled_base_tag"

          if [ -z "$base_image" ] || [ -z "$bundled_base_image" ]; then
            echo "Resolved base image is empty" >&2
            exit 1
          fi

          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "source_branch=$source_branch" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "base_image=$base_image" >> "$GITHUB_OUTPUT"
          echo "bundled_base_image=$bundled_base_image" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.checkout_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to Alibaba Cloud Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_REGISTRY_PASSWORD }}

      - name: Wait for base images
        if: github.event_name == 'workflow_run'
        env:
          BASE_IMAGE: ${{ steps.context.outputs.base_image }}
          BUNDLED_BASE_IMAGE: ${{ steps.context.outputs.bundled_base_image }}
        run: |
          for image in "$BASE_IMAGE" "$BUNDLED_BASE_IMAGE"; do
            for _ in 1 2 3 4 5; do
              if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
                break
              fi
              sleep 30
            done
            if ! docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "Base image not found: $image" >&2
              exit 1
            fi
          done

      - name: Validate resolved base images
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ steps.context.outputs.base_image }}"
          test -n "${{ steps.context.outputs.bundled_base_image }}"
          echo "Using BASE_IMAGE=${{ steps.context.outputs.base_image }}"
          echo "Using BUNDLED_BASE_IMAGE=${{ steps.context.outputs.bundled_base_image }}"

      - name: Extract runtime image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ steps.context.outputs.source_branch == 'main' }}
            type=raw,value=${{ steps.context.outputs.source_branch }},enable=${{ steps.context.outputs.source_branch == 'main' || steps.context.outputs.source_branch == 'nightly' }}
            type=raw,value=sha-${{ steps.context.outputs.short_sha }}
            type=raw,value=nightly-${{ steps.context.outputs.short_sha }},enable=${{ steps.context.outputs.source_branch == 'nightly' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.context.outputs.source_sha }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./match_composer/Dockerfile
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BASE_IMAGE=${{ steps.context.outputs.base_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=match-composer-runtime
          cache-to: type=gha,mode=max,scope=match-composer-runtime

      - name: Extract bundled runtime image metadata
        id: bundled-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=bundled-latest,enable=${{ steps.context.outputs.source_branch == 'main' }}
            type=raw,value=bundled-${{ steps.context.outputs.source_branch }},enable=${{ steps.context.outputs.source_branch == 'main' || steps.context.outputs.source_branch == 'nightly' }}
            type=raw,value=bundled-sha-${{ steps.context.outputs.short_sha }}
            type=raw,value=bundled-nightly-${{ steps.context.outputs.short_sha }},enable=${{ steps.context.outputs.source_branch == 'nightly' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.context.outputs.source_sha }}

      - name: Build and push bundled runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./match_composer/Dockerfile
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BASE_IMAGE=${{ steps.context.outputs.bundled_base_image }}
          tags: ${{ steps.bundled-meta.outputs.tags }}
          labels: ${{ steps.bundled-meta.outputs.labels }}
          cache-from: type=gha,scope=match-composer-bundled-runtime
          cache-to: type=gha,mode=max,scope=match-composer-bundled-runtime

  retag-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: read

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_REGISTRY_PASSWORD }}

      - name: Extract source runtime image tag
        id: source-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha

      - name: Extract release runtime image tags
        id: release-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Extract source bundled runtime image tag
        id: bundled-source
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=bundled-sha-

      - name: Extract release bundled runtime image tags
        id: bundled-release
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=bundled-{{version}}
            type=semver,pattern=bundled-{{major}}.{{minor}}

      - name: Wait for source images
        env:
          SOURCE_IMAGE: ${{ steps.source-meta.outputs.tags }}
          BUNDLED_SOURCE_IMAGE: ${{ steps.bundled-source.outputs.tags }}
        run: |
          for image in "$SOURCE_IMAGE" "$BUNDLED_SOURCE_IMAGE"; do
            for _ in 1 2 3 4 5; do
              if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
                break
              fi
              sleep 30
            done
            if ! docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "Source image not found: $image" >&2
              exit 1
            fi
          done

      - name: Retag release images
        env:
          SOURCE_IMAGE: ${{ steps.source-meta.outputs.tags }}
          RELEASE_TAGS: ${{ steps.release-meta.outputs.tags }}
          BUNDLED_SOURCE_IMAGE: ${{ steps.bundled-source.outputs.tags }}
          BUNDLED_RELEASE_TAGS: ${{ steps.bundled-release.outputs.tags }}
        run: |
          retag() {
            local source_image="$1"
            local release_tags="$2"
            local tags=()
            while IFS= read -r tag; do
              [ -n "$tag" ] && tags+=(-t "$tag")
            done <<< "$release_tags"
            docker buildx imagetools create "${tags[@]}" "$source_image"
          }

          retag "$SOURCE_IMAGE" "$RELEASE_TAGS"
          retag "$BUNDLED_SOURCE_IMAGE" "$BUNDLED_RELEASE_TAGS"
