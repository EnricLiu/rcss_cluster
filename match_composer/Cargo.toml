[package]
name = "match_composer"
version = "0.1.0"
edition = "2024"

[features]
default = ["agones"]
agones = ["dep:agones", "allocator/agones"]

[dependencies]
agones = { version = "1.56", optional = true }

tokio.workspace = true
futures.workspace = true
axum.workspace = true
dashmap.workspace = true

log.workspace = true
clap.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true

async-trait = "0.1.89"

common = { path = "../common" }
allocator = { path = "../allocator", default-features = false }
